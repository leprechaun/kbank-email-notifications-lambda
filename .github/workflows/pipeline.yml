name: CI Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.13'
    - name: Install poetry
      run: |
        pip install poetry

    - name: Install dependencies
      run: |
        poetry install --no-root
    - name: Run tests
      run: |
        poetry run pytest -v

  build:
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.13'
    - name: Install poetry
      run: |
        pip install pip
        pip install poetry

    - name: Install dependencies
      run: |
        poetry install --no-root
    - name: Build
      run: |
        poetry build --config-settings local-version=0.1.${{ github.run_number }}
    - name: Package
      run: |
        ./auto/package
    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: package-artifact
        path: artifact.zip

  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - build
    env:
      TF_WORKSPACE: dev
    steps:
    - uses: actions/checkout@v3
    - uses: actions/download-artifact@v4
      with:
        name: package-artifact
    - uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: eu-west-1
    - uses: hashicorp/setup-terraform@v4
    - name: Deploy
      working-directory: infra
      run: |
        terraform init
        terraform apply -auto-approve

  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    needs:
      - deploy-dev
    env:
      TF_WORKSPACE: prod
    steps:
    - uses: actions/checkout@v3
    - uses: actions/download-artifact@v4
      with:
        name: package-artifact
    - uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: eu-west-1
    - uses: hashicorp/setup-terraform@v4
    - name: Deploy
      working-directory: infra
      run: |
        terraform init
        terraform apply -auto-approve
